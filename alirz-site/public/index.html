<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alireza Sedghi</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1814;
        --paper: #f3eee6;
        --mute: #6d655c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
        padding: 2rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 6vw, 4.2rem);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      nav {
        display: flex;
        gap: 1.1rem;
      }
      a {
        display: grid;
        place-items: center;
        width: 2.6rem;
        height: 2.6rem;
        color: var(--ink);
        border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
        border-radius: 999px;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: var(--ink);
        color: var(--paper);
        outline: none;
      }
      svg {
        width: 1.15rem;
        height: 1.15rem;
        fill: currentColor;
      }
    </style>
  </head>
